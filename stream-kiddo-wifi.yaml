# Stream Kiddo - DIY build on the UeeKKoo ESP32-S3 ETH dev board (Wi-Fi, no network cable).
#
# In Home Assistant: ESPHome Device Builder > New Device > Skip, then paste this whole file.
# Wi-Fi uses the wifi_ssid / wifi_password secrets the builder already keeps for you.
# Wiring and the rest of the setup: see the README.

substitutions:
  name: stream-kiddo
  friendly_name: Stream Kiddo

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

# Optional hardening: paste the encryption key / OTA password from a fresh Device Builder
# config here. Without them the device still works on your home network.
api:
  # encryption:
  #   key: "paste-key-here"

ota:
  - platform: esphome
    # password: "paste-password-here"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the Wi-Fi details are wrong, the device opens its own hotspot so you can fix them.
  ap:

captive_portal:

mdns:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

sendspin:
  id: stream_kiddo
  task_stack_in_psram: false

# Line-out to the PCM5102A DAC. The ESP32-S3 has no APLL, so none is requested.
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO2
    i2s_bclk_pin: GPIO1

speaker:
  - platform: i2s_audio
    id: sendspin_source_speaker
    sample_rate: 48000
    i2s_dout_pin: GPIO21
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    channel: stereo
    timeout: never

media_source:
  - platform: sendspin
    id: stream_kiddo_media_source

media_player:
  - platform: sendspin
    id: stream_kiddo_media_player
    name: ${friendly_name} Player

  - platform: speaker_source
    id: stream_kiddo_speaker_player
    name: ${friendly_name} Source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: sendspin_source_speaker
      sources:
        - stream_kiddo_media_source
    volume_increment: 0.05
    volume_min: 0.05
    volume_max: 1.00