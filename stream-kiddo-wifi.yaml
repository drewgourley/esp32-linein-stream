# Stream Kiddo - DIY build on the Waveshare ESP32-P4-WIFI6 dev board (Wi-Fi 6 through its ESP32-C6).
#
# In Home Assistant: ESPHome Device Builder > New Device > Skip, then paste this whole file.
# Wi-Fi uses the wifi_ssid / wifi_password secrets the builder already keeps for you.
# Wiring and the rest of the setup: see the README.

substitutions:
  name: stream-kiddo
  friendly_name: Stream Kiddo
  # Boards with an early engineering-sample chip (boot log says "chip revision: v1.x") need "true".
  engineering_sample: "false"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32p4
  engineering_sample: ${engineering_sample}
  framework:
    type: esp-idf

psram:
  mode: hex
  speed: 100MHz

logger:
  hardware_uart: UART0
  level: INFO

# Optional hardening: paste the encryption key / OTA password from a fresh Device Builder
# config here. Without them the device still works on your home network.
api:
  # encryption:
  #   key: "paste-key-here"

ota:
  - platform: esphome
    # password: "paste-password-here"

# The board's ESP32-C6 provides Wi-Fi over SDIO.
esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the Wi-Fi details are wrong, the device opens its own hotspot so you can fix them.
  ap:

captive_portal:

mdns:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

sendspin:
  id: stream_kiddo
  task_stack_in_psram: false

# Line-out to the PCM5102A DAC. GPIO14 and GPIO15 belong to the Wi-Fi link on this board.
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO7

speaker:
  - platform: i2s_audio
    id: sendspin_source_speaker
    sample_rate: 48000
    i2s_dout_pin: GPIO8
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    channel: stereo
    use_apll: true
    timeout: never

media_source:
  - platform: sendspin
    id: stream_kiddo_media_source

media_player:
  - platform: sendspin
    id: stream_kiddo_media_player
    name: ${friendly_name} Player

  - platform: speaker_source
    id: stream_kiddo_speaker_player
    name: ${friendly_name} Source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: sendspin_source_speaker
      sources:
        - stream_kiddo_media_source
    volume_increment: 0.05
    volume_min: 0.05
    volume_max: 1.00
