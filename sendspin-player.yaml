# Board: sendspin-player (hardware/board/sendspin-player)
# ESP32-P4-Module SOM, PCM5102A DAC -> speaker + RCA line out, RGB status LED.
# No Ethernet PHY and no line-in ADC populated on this board -- WiFi + playback only.

esphome:
  name: sendspin-player
  friendly_name: Sendspin Player

esp32:
  variant: esp32p4
  engineering_sample: true
  framework:
    type: esp-idf

psram:
  mode: hex
  speed: 100MHz

external_components:
  - source:
      type: git
      url: https://github.com/drewgourley/esp32-linein-stream
      path: components
    refresh: 0s

logger:
  hardware_uart: UART0

api:

ota:
  - platform: esphome
    password: !secret ota_password

# ESP32-P4 has no radio of its own -- WiFi/BT run on the module's built-in
# ESP32-C6 co-processor over SDIO. Pins are the module's INTERNAL P4<->C6
# link (confirmed from Waveshare's own ESP32-P4-Module schematic), not
# exposed on the module's 88 external pins.
esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: update_status_led
  on_disconnect:
    - script.execute: update_status_led

mdns:

sendspin:
  id: sendspin_player
  task_stack_in_psram: false

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO7

speaker:
  - platform: i2s_audio
    id: sendspin_source_speaker
    sample_rate: 48000
    i2s_dout_pin: GPIO8
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    channel: stereo
    use_apll: true
    timeout: never

media_source:
  - platform: sendspin
    id: sendspin_player_media_source

media_player:
  - platform: sendspin
    id: sendspin_player_media_player
    name: Sendspin Player
    on_state:
      - script.execute: update_status_led

  - platform: speaker_source
    id: sendspin_player_speaker_player
    name: Sendspin Player Source
    on_state:
      - script.execute: update_status_led

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: sendspin_source_speaker
      sources:
        - sendspin_player_media_source
    volume_increment: 0.05
    volume_min: 0.05
    volume_max: 1.00

# RGB status LED (D3, common anode): active-low, so `inverted: true` lets
# output.turn_on() mean "this color is lit".
output:
  - platform: gpio
    pin: GPIO1
    id: status_led_red
    inverted: true
  - platform: gpio
    pin: GPIO2
    id: status_led_green
    inverted: true
  - platform: gpio
    pin: GPIO3
    id: status_led_blue
    inverted: true

script:
  - id: update_status_led
    then:
      - lambda: |-
          id(status_led_red).turn_off();
          id(status_led_green).turn_off();
          id(status_led_blue).turn_off();
          if (!id(wifi_component).is_connected()) {
            id(status_led_red).turn_on();
            return;
          }
          bool playing = id(sendspin_player_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                         id(sendspin_player_speaker_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
          if (playing) {
            id(status_led_blue).turn_on();
          } else {
            id(status_led_green).turn_on();
          }
