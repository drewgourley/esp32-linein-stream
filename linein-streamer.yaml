# Board: Waveshare ESP32-P4-Eth
# Definition: definitions/boards/waveshare_esp32_p4_eth/manifest.yaml

esphome:
  name: sendspin-hub-prototype
  friendly_name: Sendspin Hub Prototype
  on_boot:
    priority: -100.0
    then:
      - number.set:
          id: linein_gain
          value: !lambda "return id(linein_gain).state;"
      - number.set:
          id: eq_bass
          value: !lambda "return id(eq_bass).state;"
      - number.set:
          id: eq_mid
          value: !lambda "return id(eq_mid).state;"
      - number.set:
          id: eq_treble
          value: !lambda "return id(eq_treble).state;"

esp32:
  variant: esp32p4
  engineering_sample: true
  framework:
    type: esp-idf

psram:
  mode: hex
  speed: 100MHz

external_components:
  - source:
      type: git
      url: https://github.com/drewgourley/esp32-linein-stream
      path: components
    refresh: 0s

logger:
  hardware_uart: UART0

api:

ota:
  - platform: esphome
    password: I am 1 taco lover!

ethernet:
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  phy_addr: 1
  power_pin: GPIO51
  type: IP101

mdns:

sendspin:
  id: sendspin_hub_prototype
  task_stack_in_psram: true

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO14

speaker:
  - platform: i2s_audio
    id: sendspin_hub_prototype_speaker
    sample_rate: 48000
    i2s_dout_pin: GPIO15
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    channel: stereo
    use_apll: true

media_source:
  - platform: sendspin
    id: sendspin_hub_prototype_media_source

media_player:
  - platform: sendspin
    id: sendspin_hub_prototype_media_player
    name: Sendspin Hub Prototype Player

  - platform: speaker_source
    id: external_media_player
    name: Sendspin Hub Prototype Source

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: sendspin_hub_prototype_speaker
      sources:
        - sendspin_hub_prototype_media_source
    volume_increment: 0.05
    volume_min: 0.05
    volume_max: 1.00

linein_stream:
  id: linein_streamer
  bclk_pin: GPIO3
  lrclk_pin: GPIO2
  din_pin: GPIO4
  i2s_mode: master
  i2s_port: 1
  mclk_pin: GPIO5
  mclk_multiple: 256
  i2s_format: philips
  sample_rate: 48000
  gain: 1.0
  channels: 2
  port: 8080
  monitor_speaker_id: sendspin_hub_prototype_speaker
  monitor_media_player_id: external_media_player
  equalizer:
    - type: low_shelf
      frequency: 100
      q: 0.707
      gain: 0
    - type: peaking
      frequency: 1000
      q: 0.9
      gain: 0
    - type: high_shelf
      frequency: 10000
      q: 0.707
      gain: 0

number:
  - platform: template
    name: "Line-In Gain"
    id: linein_gain
    icon: "mdi:volume-high"
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 12
    min_value: -6
    max_value: 30
    step: 0.5
    set_action:
      - lambda: "id(linein_streamer).set_gain(powf(10.0f, x / 20.0f));"

  - platform: template
    name: "EQ Bass"
    id: eq_bass
    icon: "mdi:equalizer"
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -12
    max_value: 12
    step: 0.5
    set_action:
      - lambda: "id(linein_streamer).set_band_gain(0, x);"

  - platform: template
    name: "EQ Mid"
    id: eq_mid
    icon: "mdi:equalizer"
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -12
    max_value: 12
    step: 0.5
    set_action:
      - lambda: "id(linein_streamer).set_band_gain(1, x);"

  - platform: template
    name: "EQ Treble"
    id: eq_treble
    icon: "mdi:equalizer"
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -12
    max_value: 12
    step: 0.5
    set_action:
      - lambda: "id(linein_streamer).set_band_gain(2, x);"

