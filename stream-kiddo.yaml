esphome:
  name: stream-kiddo
  friendly_name: Stream Kiddo

esp32:
  variant: esp32p4
  engineering_sample: true
  framework:
    type: esp-idf

psram:
  mode: hex
  speed: 100MHz

external_components:
  - source:
      type: git
      url: https://github.com/drewgourley/esp32-linein-stream
      path: components
    refresh: 0s

logger:
  hardware_uart: UART0

api:

ota:
  - platform: esphome
    password: !secret ota_password

esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: update_status_led
  on_disconnect:
    - script.execute: update_status_led

mdns:

sendspin:
  id: stream_kiddo
  task_stack_in_psram: false

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO7

speaker:
  - platform: i2s_audio
    id: sendspin_source_speaker
    sample_rate: 48000
    i2s_dout_pin: GPIO8
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    channel: stereo
    use_apll: true
    timeout: never

media_source:
  - platform: sendspin
    id: stream_kiddo_media_source

media_player:
  - platform: sendspin
    id: stream_kiddo_media_player
    name: Stream Kiddo Player
    on_state:
      - script.execute: update_status_led
      - script.execute: update_dac_mute

  - platform: speaker_source
    id: stream_kiddo_speaker_player
    name: Stream Kiddo Source
    on_state:
      - script.execute: update_status_led
      - script.execute: update_dac_mute

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: sendspin_source_speaker
      sources:
        - stream_kiddo_media_source
    volume_increment: 0.05
    volume_min: 0.05
    volume_max: 1.00

output:
  - platform: gpio
    pin: GPIO1
    id: dac_xsmt
  - platform: gpio
    pin: GPIO9
    id: status_led_red
    inverted: true
  - platform: gpio
    pin: GPIO10
    id: status_led_green
    inverted: true
  - platform: gpio
    pin: GPIO11
    id: status_led_blue
    inverted: true

script:
  - id: update_dac_mute
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(stream_kiddo_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                     id(stream_kiddo_speaker_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
          then:
            - delay: 150ms
            - output.turn_on: dac_xsmt
          else:
            - output.turn_off: dac_xsmt

  - id: update_status_led
    then:
      - lambda: |-
          id(status_led_red).turn_off();
          id(status_led_green).turn_off();
          id(status_led_blue).turn_off();
          if (!id(wifi_component).is_connected()) {
            id(status_led_red).turn_on();
            return;
          }
          bool playing = id(stream_kiddo_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                         id(stream_kiddo_speaker_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
          if (playing) {
            id(status_led_blue).turn_on();
          } else {
            id(status_led_green).turn_on();
          }
