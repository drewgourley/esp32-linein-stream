# Stream Daddy - DIY build on the Waveshare ESP32-P4-WIFI6 dev board (Wi-Fi 6 through its ESP32-C6).
#
# In Home Assistant: ESPHome Device Builder > New Device > Skip, then paste this whole file.
# Wi-Fi uses the wifi_ssid / wifi_password secrets the builder already keeps for you.
# Wiring and the rest of the setup: see the README.

substitutions:
  name: stream-daddy
  friendly_name: Stream Daddy
  # Boards with an early engineering-sample chip (boot log says "chip revision: v1.x") need "true".
  engineering_sample: "false"
  stream_port: "8080"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100.0
    then:
      # Push the restored gain/EQ values into the DSP after a reboot.
      - number.set:
          id: linein_gain
          value: !lambda "return id(linein_gain).state;"
      - number.set:
          id: eq_bass
          value: !lambda "return id(eq_bass).state;"
      - number.set:
          id: eq_mid
          value: !lambda "return id(eq_mid).state;"
      - number.set:
          id: eq_treble
          value: !lambda "return id(eq_treble).state;"
      - text_sensor.template.publish:
          id: stream_url
          state: !lambda 'return std::string("http://") + App.get_name().c_str() + ".local:${stream_port}/";'

esp32:
  variant: esp32p4
  engineering_sample: ${engineering_sample}
  framework:
    type: esp-idf

psram:
  mode: hex
  speed: 100MHz

external_components:
  - source:
      type: git
      url: https://github.com/drewgourley/esp32-linein-stream
      ref: master
      path: components
    components: [linein_stream]

logger:
  hardware_uart: UART0
  level: INFO

# Optional hardening: paste the encryption key / OTA password from a fresh Device Builder
# config here. Without them the device still works on your home network.
api:
  # encryption:
  #   key: "paste-key-here"

ota:
  - platform: esphome
    # password: "paste-password-here"

# The board's ESP32-C6 provides Wi-Fi over SDIO.
esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the Wi-Fi details are wrong, the device opens its own hotspot so you can fix them.
  ap:

captive_portal:

mdns:

text_sensor:
  - platform: template
    id: stream_url
    name: "Stream URL"
    icon: "mdi:link-variant"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

sendspin:
  id: stream_daddy
  task_stack_in_psram: false

# Line-out to the PCM5102A DAC. GPIO14 and GPIO15 belong to the Wi-Fi link on this board.
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO7

speaker:
  - platform: i2s_audio
    id: stream_daddy_speaker
    sample_rate: 48000
    i2s_dout_pin: GPIO8
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    channel: stereo
    use_apll: true
    timeout: never

  # Shares the DAC between Sendspin playback and the line-in pass-through.
  - platform: mixer
    id: shared_speaker_mixer
    output_speaker: stream_daddy_speaker
    queue_mode: true
    source_speakers:
      - id: sendspin_source_speaker
        timeout: never
      - id: monitor_source_speaker
        timeout: never

media_source:
  - platform: sendspin
    id: stream_daddy_media_source

media_player:
  - platform: sendspin
    id: stream_daddy_media_player
    name: ${friendly_name} Player

  - platform: speaker_source
    id: external_media_player
    name: ${friendly_name} Source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: sendspin_source_speaker
      sources:
        - stream_daddy_media_source
    volume_increment: 0.05
    volume_min: 0.05
    volume_max: 1.00

# Line-in capture from the PCM1808 ADC, served as a WAV stream on port ${stream_port}.
linein_stream:
  id: linein_streamer
  bclk_pin: GPIO3
  lrclk_pin: GPIO2
  din_pin: GPIO4
  mclk_pin: GPIO5
  mclk_multiple: 256
  # All-in-one ADC module that makes its own clocks: use i2s_mode: slave and drop mclk_pin.
  i2s_mode: master
  i2s_port: 1
  i2s_format: philips
  sample_rate: 48000
  gain: 1.0
  channels: 2
  port: ${stream_port}
  monitor_speaker_id: monitor_source_speaker
  monitor_media_player_id: external_media_player
  equalizer:
    - type: low_shelf
      frequency: 100
      q: 0.707
      gain: 0
    - type: peaking
      frequency: 1000
      q: 0.9
      gain: 0
    - type: high_shelf
      frequency: 10000
      q: 0.707
      gain: 0

number:
  - platform: template
    name: "Line-In Gain"
    id: linein_gain
    icon: "mdi:volume-high"
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 12
    min_value: -6
    max_value: 30
    step: 0.5
    set_action:
      - lambda: "id(linein_streamer).set_gain(powf(10.0f, x / 20.0f));"

  - platform: template
    name: "EQ Bass"
    id: eq_bass
    icon: "mdi:equalizer"
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -12
    max_value: 12
    step: 0.5
    set_action:
      - lambda: "id(linein_streamer).set_band_gain(0, x);"

  - platform: template
    name: "EQ Mid"
    id: eq_mid
    icon: "mdi:equalizer"
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -12
    max_value: 12
    step: 0.5
    set_action:
      - lambda: "id(linein_streamer).set_band_gain(1, x);"

  - platform: template
    name: "EQ Treble"
    id: eq_treble
    icon: "mdi:equalizer"
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -12
    max_value: 12
    step: 0.5
    set_action:
      - lambda: "id(linein_streamer).set_band_gain(2, x);"
